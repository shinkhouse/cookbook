<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sam's Cookbook</title>
        <base href="/cookbook/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <meta name="theme-color" content="#FBF7EF" />
        <!--
            Newsreader, Karla and IBM Plex Mono are self-hosted through
            @fontsource (see angular.json), per design spec §3.2 — no Google
            Fonts CDN. Material Icons is still fetched here; mat-icon is the one
            Material component the new design keeps (§2.4).
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
    </head>
    <body class="mat-typography">
        <app-root></app-root>
    </body>
</html>
