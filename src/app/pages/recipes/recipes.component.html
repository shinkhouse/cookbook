<div class="big-container-section">
    <h1>Simple, flavorful recipes</h1>
    <p>This is a collection of recipes my wife and I like to cook or have tried.</p>
</div>
<div class="search-actions">
    <div class="search-bar mat-elevation-z2">
        <mat-icon (click)="textarea1.focus()">search</mat-icon>
        <input #textarea1 type="text" placeholder="Search Recipes" [(ngModel)]="searchQuery" />
    </div>
    <button class="favorites-filter-btn mat-elevation-z2" mat-icon-button (click)="toggleFavorites()" matTooltip="Show Favorites Only">
        <mat-icon class="favorite-icon" *ngIf="onlyFavoritesShown">star</mat-icon>
        <mat-icon *ngIf="!onlyFavoritesShown">star_outline</mat-icon>
    </button>
</div>
<main class="recipes">
    <mat-grid-list *ngIf="getSearchResults().length > 0" rowHeight="400px" [cols]="gridColumnSize">
        <ng-container *ngFor="let recipe of getSearchResults()">
            <mat-grid-tile *ngIf="onlyFavoritesShown ? recipe.favorite : true" routerLink="/recipe/{{ recipe.slug }}">
                <mat-card appearance="outlined">
                    <img *ngIf="recipe.coverImage" mat-card-image [src]="recipe.coverImage" [alt]="recipe.title" />
                    <mat-card-header class="recipe-card-header">
                        <mat-card-title>{{ recipe.title }}</mat-card-title>
                        <mat-card-subtitle>{{ recipe.subtitle }}</mat-card-subtitle>
                        <span class="spacer"></span>
                        <button class="mat-elevation-z2" mat-icon-button *ngIf="recipe.favorite">
                            <mat-icon matTooltip="Favorite Recipe!" class="favorite-icon">star</mat-icon>
                        </button>
                        <button class="mat-elevation-z2" mat-icon-button *ngIf="!recipe.favorite">
                            <mat-icon class="inactive-favorite-icon">star_outline</mat-icon>
                        </button>
                    </mat-card-header>
                    <mat-card-content>
                        <p>
                            {{ recipe.description }}
                        </p>
                    </mat-card-content>
                </mat-card>
            </mat-grid-tile>
        </ng-container>
    </mat-grid-list>

    <div class="no-recipes" *ngIf="getSearchResults().length === 0">
        <mat-icon>ramen_dining</mat-icon>
        <p>Cannot find recipe, "{{ searchQuery }}"</p>
    </div>
</main>
